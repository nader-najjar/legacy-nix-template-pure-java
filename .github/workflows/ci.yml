name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      repository:
        required: true
        type: string
      source_sha:
        required: true
        type: string
    outputs:
      accepted:
        value: ${{ jobs.release.outputs.accepted }}

permissions:
  contents: read

jobs:
  pull_request:
    name: Build
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/build.yml

  release:
    name: Build
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/build.yml
    with:
      repository: ${{ inputs.repository }}
      source_sha: ${{ inputs.source_sha }}
